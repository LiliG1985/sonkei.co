<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONKEI CO. — Under Maintenance</title>
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --lavender:#B7A2D4;
    --lavender-deep:#9A82BE;
    --silver:#AEB4BC;
    --tan:#C8B08A;
    --black:#111214;
    --offwhite:#F3F0EB;
    --serif:'Bodoni Moda', Georgia, 'Times New Roman', serif;
    --sans:'Manrope', 'Helvetica Neue', Arial, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:var(--sans);
    background:var(--black);
    color:var(--offwhite);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }

  .glow{
    position:absolute;
    width:60vw;
    height:60vw;
    max-width:700px;
    max-height:700px;
    background:radial-gradient(circle, rgba(183,162,212,0.16) 0%, rgba(183,162,212,0) 70%);
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:560px;
    width:100%;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo{
    height:44px;
    width:auto;
    margin-bottom:48px;
    opacity:0.96;
  }

  .eyebrow{
    font-family:var(--sans);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.28em;
    color:var(--lavender);
    text-transform:uppercase;
    margin-bottom:18px;
  }

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(30px, 5vw, 44px);
    line-height:1.15;
    color:var(--offwhite);
    margin-bottom:20px;
  }

  p.body-copy{
    font-family:var(--sans);
    font-size:15px;
    line-height:1.7;
    color:rgba(243,240,235,0.72);
    max-width:420px;
    margin:0 auto 40px;
  }

  .divider{
    width:40px;
    height:1px;
    background:var(--tan);
    margin:0 auto 40px;
    opacity:0.6;
  }

  .footer-note{
    font-family:var(--sans);
    font-size:12px;
    line-height:1.8;
    color:rgba(243,240,235,0.45);
    letter-spacing:0.02em;
  }

  .footer-note .label{
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-size:10px;
    color:rgba(243,240,235,0.35);
    display:block;
    margin-bottom:8px;
  }

  .footer-note a{
    color:var(--lavender);
    text-decoration:none;
  }

  .footer-note a:hover{
    text-decoration:underline;
  }

  .footer-note .sep{
    margin:0 8px;
    color:rgba(243,240,235,0.25);
  }

  @media (max-width:480px){
    .footer-note .sep{ display:block; margin:6px 0 0; height:0; }
  }
</style>
</head>
